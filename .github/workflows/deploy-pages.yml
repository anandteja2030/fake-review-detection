name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A static host has no backend. Without VITE_API_BASE the bundle calls
      # https://<owner>.github.io/<repo>/api, which answers GET with 404 and
      # POST with 405, so fail here instead of publishing a broken site.
      - name: Require VITE_API_BASE
        if: ${{ vars.VITE_API_BASE == '' }}
        run: |
          echo "::error title=VITE_API_BASE is not set::The Pages bundle would call /api on github.io, which has no backend (404 on GET, 405 on POST). Set Settings -> Secrets and variables -> Actions -> Variables -> VITE_API_BASE = https://<your-api-host>/api, then re-run this workflow."
          exit 1

      # npm workspaces: the only lockfile lives at the repository root.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          # Optional: point the browser at a deployed API. Falls back to /api.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
