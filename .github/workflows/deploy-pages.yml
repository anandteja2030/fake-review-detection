name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The static bundle runs the trained models itself (browser inference),
      # so it needs no backend and this build cannot 404/405 on /api. Setting
      # the VITE_API_BASE variable is still supported and switches the build to
      # the HTTP client against a deployed Express API instead.
      - name: Report inference mode
        run: |
          if [ -n "${{ vars.VITE_API_BASE }}" ]; then
            echo "Inference: remote API at ${{ vars.VITE_API_BASE }}"
          else
            echo "Inference: in-browser (trained models shipped in frontend/public/model-data)"
          fi

      # npm workspaces: the only lockfile lives at the repository root.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          # The lockfile is maintained with the npm that ships with Node 24.
          npm ci --no-audit --no-fund || {
            echo "::warning::npm ci could not satisfy the lockfile in CI; falling back to npm install"
            npm install --no-audit --no-fund
          }

      - name: Build static site
        run: npm run build
        env:
          # Optional: point the browser at a deployed API instead of running the
          # models locally. Empty = in-browser inference (the default for Pages).
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
